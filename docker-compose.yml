services:
  gateway:
    build: .
    container_name: obsidian-mcp-gateway
    restart: unless-stopped
    ports:
      - "3385:3385"
    environment:
      # Values are read from the .env file in this directory (compose auto-loads it).
      PORT: ${PORT:-3385}
      # The PUBLIC https:// URL of the tunnel that fronts port 3385.
      # Must match it character-for-character — it becomes the OAuth issuer.
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      # Password typed on the /authorize login page (Claude sign-in).
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Set MASTER_PASSWORD in .env}
      # Static API key used by the local proxy (DeepSeek / MCP SuperAssistant).
      STATIC_API_KEY: ${STATIC_API_KEY:?Set STATIC_API_KEY in .env}
      # HS256 secret for JWT access tokens. Generate: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Your Obsidian MCP server (SSE). host.docker.internal reaches the host.
      OBSIDIAN_MCP_URL: ${OBSIDIAN_MCP_URL:-http://host.docker.internal:8385/mcp}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-43200}
      AUTH_CODE_TTL_SECONDS: ${AUTH_CODE_TTL_SECONDS:-60}
    extra_hosts:
      # Makes host.docker.internal work on Linux hosts (Docker Desktop maps it natively).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist registered OAuth clients (Claude's DCR registration) across restarts.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3385)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

  # Local MCP SuperAssistant proxy for DeepSeek & other web LLMs (extension → http://localhost:2006/sse).
  # Connects to PUBLIC_URL/mcp (Streamable HTTP) with Authorization: Bearer STATIC_API_KEY, both read from .env.
  local-proxy:
    image: node:22-alpine
    container_name: obsidian-mcp-local-proxy
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Bound to localhost only — this port carries your API key upstream.
      - "127.0.0.1:2006:2006"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      STATIC_API_KEY: ${STATIC_API_KEY:?Set STATIC_API_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        node -e '
          const base = process.env.PUBLIC_URL.replace(/\/+$$/, "");
          const cfg = { mcpServers: { obsidian: { type: "streamable-http", url: base + "/mcp", headers: { Authorization: "Bearer " + process.env.STATIC_API_KEY } } } };
          require("fs").writeFileSync("/tmp/config.json", JSON.stringify(cfg, null, 2));
          console.log("Claude.ai connector URL : " + base + "/mcp");
          console.log("Extension (other LLMs)  : http://localhost:2006/sse");
        '
        exec npx -y @srbhptl39/mcp-superassistant-proxy@latest --config /tmp/config.json --port 2006 --host 0.0.0.0
