services:
  gateway:
    build: .
    container_name: obsidian-mcp-gateway
    restart: unless-stopped
    ports:
      - "3385:3385"
    environment:
      # Values are read from the .env file in this directory (compose auto-loads it).
      PORT: ${PORT:-3385}
      # The PUBLIC https:// URL of the tunnel that fronts port 3385.
      # Must match it character-for-character — it becomes the OAuth issuer.
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      # Password typed on the /authorize login page (Claude sign-in).
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Set MASTER_PASSWORD in .env}
      # Static API key used by the local proxy (DeepSeek / MCP SuperAssistant).
      STATIC_API_KEY: ${STATIC_API_KEY:?Set STATIC_API_KEY in .env}
      # HS256 secret for JWT access tokens. Generate: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Your Obsidian MCP server (SSE). host.docker.internal reaches the host.
      OBSIDIAN_MCP_URL: ${OBSIDIAN_MCP_URL:-http://host.docker.internal:8385/sse}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-43200}
      AUTH_CODE_TTL_SECONDS: ${AUTH_CODE_TTL_SECONDS:-60}
    extra_hosts:
      # Makes host.docker.internal work on Linux hosts (Docker Desktop maps it natively).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist registered OAuth clients (Claude's DCR registration) across restarts.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3385)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
